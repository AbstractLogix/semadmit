name: Coverage

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@0cab6f57ca63e907d25895e0242c529282f1cdc8 # v2.4.7
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.18.1.0"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Run test and coverage gates
        run: python3 scripts/check_coverage.py
